<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swish - 1:1 Kopia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b121c;
            overflow: hidden;
            color: #ffffff;
        }

        #swish-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0b121c;
            user-select: none;
            cursor: pointer;
        }

        /* Status Bar */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            z-index: 10;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .battery-box {
            border: 1.5px solid #fff;
            border-radius: 4px;
            padding: 1px 4px;
            font-size: 10px;
            font-weight: 700;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Green Header */
        .green-header {
            flex: 0 0 52%;
            background: linear-gradient(135deg, #189856 0%, #72e8a4 100%);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(24, 152, 86, 0.4);
        }

        .check-circle {
            width: 86px;
            height: 86px;
            border: 3.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .check-checkmark {
            width: 40px;
            height: 22px;
            border-left: 4.5px solid #ffffff;
            border-bottom: 4.5px solid #ffffff;
            transform: rotate(-45deg) translate(3px, -2px);
        }

        .success-message {
            font-size: 25px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.4px;
        }

        /* Details Body */
        .details-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 28px;
            background-color: #0b121c;
        }

        .transaction-date {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .recipient-name {
            font-size: 27px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .recipient-phone {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .amount-text {
            font-size: 44px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Bottom Footer Bar */
        .bottom-bar {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background-color: #0b121c;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Using actual user asset IMG_4552.png */
        .swish-logo-img {
            height: 32px;
            width: auto;
        }

        .close-circle {
            width: 42px;
            height: 42px;
            background: #172130;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 20px;
            border: none;
        }

        /* Glitter Particle Animation */
        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: particleAnim 0.85s forwards ease-out;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
        }

        @keyframes particleAnim {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="swish-screen" onclick="handleScreenTap(event)">
        <!-- Live Status Bar -->
        <div class="status-bar">
            <span id="live-time">01:46</span>
            <div class="status-right">
                <span>5G</span>
                <div class="battery-box">80</div>
            </div>
        </div>

        <!-- Confirmation Content -->
        <div class="main-container">
            <div class="green-header">
                <div class="check-circle">
                    <div class="check-checkmark"></div>
                </div>
                <div class="success-message">Din betalning är skickad!</div>
            </div>

            <div class="details-body">
                <div class="transaction-date" id="display-date">25 aug. 2026, kl 01:46</div>
                <div class="recipient-name">Shaqeel</div>
                <div class="recipient-phone">+46 70 000 00 00</div>
                <div class="amount-text">1 kr</div>
            </div>

            <!-- Bottom Footer Bar with actual uploaded logo asset -->
            <div class="bottom-bar" onclick="event.stopPropagation()">
                <div class="brand-lockup">
                    <!-- IMG_4552.png asset reference -->
                    <img src="IMG_4552.png" alt="Swish Logo" class="swish-logo-img">
                </div>
                <button class="close-circle" onclick="location.reload()">✕</button>
            </div>
        </div>
    </div>

    <script>
        // Sync clock with actual system time immediately
        function updateLiveClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            
            document.getElementById('live-time').innerText = timeStr;

            const months = ['jan.', 'feb.', 'mars', 'apr.', 'maj', 'juni', 'juli', 'aug.', 'sep.', 'okt.', 'nov.', 'dec.'];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            
            document.getElementById('display-date').innerText = `${day} ${month} ${year}, kl ${timeStr}`;
        }
        
        updateLiveClock();
        setInterval(updateLiveClock, 10000);

        // Glitter effect & audio chime on tap
        function handleScreenTap(e) {
            playChimeSound();
            
            const screen = document.getElementById('swish-screen');
            const rect = screen.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 7 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${clickX}px`;
                particle.style.top = `${clickY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                screen.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 850);
            }
        }

        function playChimeSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (err) {}
        }
    </script>
</body>
</html>
