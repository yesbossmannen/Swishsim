<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swisha - Simulering</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b131e;
            overflow: hidden;
            color: #ffffff;
        }

        /* Input Screen (Swisha form) */
        #input-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1724;
            display: flex;
            flex-direction: column;
            padding: 16px;
            z-index: 10;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            padding: 0 8px;
        }

        .close-icon, .help-icon {
            font-size: 24px;
            color: #ffffff;
            cursor: pointer;
        }

        .app-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .tab-container {
            display: flex;
            gap: 8px;
            padding: 10px 8px;
            margin-bottom: 10px;
        }

        .tab {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .tab.active {
            background-color: #2ba696;
            color: #ffffff;
        }

        .tab.inactive {
            background-color: #1e293b;
            color: #94a3b8;
        }

        .form-fields {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px 8px;
            flex: 1;
        }

        .field-row {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
        }

        .field-label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .field-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            outline: none;
        }

        .submit-container {
            padding: 10px 8px 20px 8px;
        }

        .swisha-btn {
            width: 100%;
            padding: 16px;
            background-color: #2ba696;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .swisha-btn:active {
            background-color: #238a7d;
        }

        /* Confirmation Screen */
        #confirmation-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1724;
            display: none;
            flex-direction: column;
            user-select: none;
            cursor: pointer;
            z-index: 20;
        }

        .green-header {
            flex: 0 0 54%;
            background: linear-gradient(135deg, #1fa76d 0%, #6ee7b7 100%);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(31, 167, 109, 0.3);
            overflow: hidden;
        }

        .check-container {
            width: 84px;
            height: 84px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .check-icon {
            width: 40px;
            height: 22px;
            border-left: 4px solid #ffffff;
            border-bottom: 4px solid #ffffff;
            transform: rotate(-45deg) translate(3px, -2px);
        }

        .success-text {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .details-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            background-color: #0f1724;
        }

        .timestamp-text {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 18px;
        }

        .recipient-display {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .phone-display {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .amount-display {
            font-size: 44px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .message-display {
            font-size: 16px;
            color: #cbd5e1;
            margin-top: 10px;
        }

        .bottom-bar {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background-color: #0f1724;
        }

        .swish-brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Authentic Swish Logo Recreation */
        .swish-logo-graphic {
            width: 32px;
            height: 32px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swish-s-curve {
            width: 28px;
            height: 28px;
            border: 4px solid transparent;
            border-top-color: #00fa9a;
            border-left-color: #00bfff;
            border-radius: 50%;
            transform: rotate(-45deg);
        }

        .swish-wordmark {
            font-size: 24px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .exit-btn {
            width: 42px;
            height: 42px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 20px;
        }

        /* Particle Glitter Effect */
        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: glitterBurst 0.9s forwards ease-out;
            box-shadow: 0 0 6px rgba(255,255,255,0.8);
        }

        @keyframes glitterBurst {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Input Form Screen -->
    <div id="input-screen">
        <div class="top-nav">
            <span class="close-icon">✕</span>
            <span class="app-title">Swisha</span>
            <span class="help-icon">?</span>
        </div>
        <div class="tab-container">
            <div class="tab active">Vanlig</div>
            <div class="tab inactive">Företag</div>
        </div>
        <div class="form-fields">
            <div class="field-row">
                <div class="field-label">Mottagare</div>
                <input type="text" id="inp-name" class="field-input" value="Putin">
            </div>
            <div class="field-row">
                <div class="field-label">Telefonnummer</div>
                <input type="text" id="inp-phone" class="field-input" value="+46 00 000 00">
            </div>
            <div class="field-row">
                <div class="field-label">Belopp</div>
                <input type="text" id="inp-amount" class="field-input" value="90000000000">
            </div>
            <div class="field-row">
                <div class="field-label">Meddelande</div>
                <input type="text" id="inp-msg" class="field-input" value="Hallo">
            </div>
        </div>
        <div class="submit-container">
            <button class="swisha-btn" onclick="triggerSwish()">Swisha</button>
        </div>
    </div>

    <!-- Confirmation Screen -->
    <div id="confirmation-screen" onclick="spawnGlitter(event)">
        <div class="green-header" id="header-area">
            <div class="check-container">
                <div class="check-icon"></div>
            </div>
            <div class="success-text">Din betalning är skickad!</div>
        </div>
        <div class="details-section">
            <div class="timestamp-text" id="out-time">30 maj. 2025, kl 18:30</div>
            <div class="recipient-display" id="out-name">Putin</div>
            <div class="phone-display" id="out-phone">+46 00 000 00</div>
            <div class="amount-display"><span id="out-amount">90000000000</span> kr</div>
            <div class="message-display" id="out-msg">Hallo</div>
        </div>
        <div class="bottom-bar" onclick="event.stopPropagation()">
            <div class="swish-brand-container">
                <div class="swish-logo-graphic">
                    <div class="swish-s-curve"></div>
                </div>
                <div class="swish-wordmark">swish</div>
            </div>
            <div class="exit-btn" onclick="resetApp()">✕</div>
        </div>
    </div>

    <script>
        function triggerSwish() {
            document.getElementById('out-name').innerText = document.getElementById('inp-name').value;
            document.getElementById('out-phone').innerText = document.getElementById('inp-phone').value;
            document.getElementById('out-amount').innerText = document.getElementById('inp-amount').value;
            document.getElementById('out-msg').innerText = document.getElementById('inp-msg').value;

            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('confirmation-screen').style.display = 'flex';
        }

        function resetApp() {
            document.getElementById('confirmation-screen').style.display = 'none';
            document.getElementById('input-screen').style.display = 'flex';
        }

        function spawnGlitter(e) {
            const screen = document.getElementById('confirmation-screen');
            const rect = screen.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Spawn multiple glitter particles simulating the reference video effect
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 6 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${clickX}px`;
                particle.style.top = `${clickY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 90 + 15;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);

                screen.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 900);
            }
        }
    </script>
</body>
</html>
