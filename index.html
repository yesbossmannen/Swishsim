<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swish - 1:1 Kopia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b121c;
            overflow: hidden;
            color: #ffffff;
        }

        /* Setup Form Screen */
        #setup-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b121c;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 100;
        }

        .setup-card {
            background: #172130;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .setup-card h2 {
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
            color: #4cd964;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0b121c;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4cd964;
        }

        .launch-btn {
            width: 100%;
            padding: 13px;
            background: #189856;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Swish App Screen */
        #swish-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: #0b121c;
            user-select: none;
        }

        /* Status Bar */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            z-index: 10;
            background: #169252;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .battery-box {
            border: 1.5px solid #fff;
            border-radius: 4px;
            padding: 1px 4px;
            font-size: 10px;
            font-weight: 700;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Green Header - Smooth curved bottom edge matching app layout */
        .green-header {
            flex: 0 0 52%;
            background: linear-gradient(135deg, #169252 0%, #68e29e 100%);
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 12px 35px rgba(22, 146, 82, 0.45);
            overflow: hidden;
            cursor: pointer;
        }

        .check-circle {
            width: 82px;
            height: 82px;
            border: 3.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            z-index: 2;
        }

        .check-checkmark {
            width: 38px;
            height: 20px;
            border-left: 4.5px solid #ffffff;
            border-bottom: 4.5px solid #ffffff;
            transform: rotate(-45deg) translate(3px, -2px);
        }

        .success-message {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.4px;
            z-index: 2;
        }

        /* Details Body */
        .details-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 28px;
            background-color: #0b121c;
        }

        .transaction-date {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .recipient-name {
            font-size: 27px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .recipient-phone {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .amount-text {
            font-size: 44px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Bottom Footer Bar */
        .bottom-bar {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background-color: #0b121c;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .swish-logo-img {
            height: 32px;
            width: auto;
        }

        .close-circle {
            width: 42px;
            height: 42px;
            background: #172130;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 20px;
            border: none;
        }

        /* Ambient Floating Particles inside Green Header */
        .ambient-particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            animation: floatParticle 4s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-12px) scale(1.3);
                opacity: 0.8;
            }
        }

        /* Tap Glitter Burst Particle */
        .burst-particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: burstAnim 0.85s forwards ease-out;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
            z-index: 5;
        }

        @keyframes burstAnim {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>Swish Simuleringsinställningar</h2>
            <div class="input-group">
                <label>Mottagarnamn</label>
                <input type="text" id="cfg-name" value="Shaqeel">
            </div>
            <div class="input-group">
                <label>Telefonnummer</label>
                <input type="text" id="cfg-phone" value="+46 70 000 00 00">
            </div>
            <div class="input-group">
                <label>Belopp</label>
                <input type="text" id="cfg-amount" value="1 kr">
            </div>
            <div class="input-group">
                <label>Datum & Tid</label>
                <input type="text" id="cfg-date" value="25 aug. 2026, kl 01:55">
            </div>
            <button class="launch-btn" onclick="startSimulation()">Visa Skärm</button>
        </div>
    </div>

    <!-- Swish App Simulation Screen -->
    <div id="swish-app">
        <!-- Status Bar -->
        <div class="status-bar" id="status-bar-bg">
            <span id="live-time">01:55</span>
            <div class="status-right">
                <span>5G</span>
                <div class="battery-box">80</div>
            </div>
        </div>

        <div class="main-container">
            <!-- Green Header (Only this area is clickable and contains floating particles) -->
            <div class="green-header" id="green-header" onclick="handleGreenHeaderTap(event)">
                <div class="check-circle">
                    <div class="check-checkmark"></div>
                </div>
                <div class="success-message">Din betalning är skickad!</div>
            </div>

            <div class="details-body">
                <div class="transaction-date" id="display-date">25 aug. 2026, kl 01:55</div>
                <div class="recipient-name" id="display-name">Shaqeel</div>
                <div class="recipient-phone" id="display-phone">+46 70 000 00 00</div>
                <div class="amount-text" id="display-amount">1 kr</div>
            </div>

            <!-- Bottom Footer Bar -->
            <div class="bottom-bar">
                <div class="brand-lockup">
                    <img src="IMG_4552.png" alt="Swish Logo" class="swish-logo-img">
                </div>
                <button class="close-circle" onclick="returnToSetup()">✕</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize ambient floating particles inside the green header
        function initAmbientParticles() {
            const header = document.getElementById('green-header');
            for (let i = 0; i < 18; i++) {
                const p = document.createElement('div');
                p.classList.add('ambient-particle');
                const size = Math.random() * 4 + 2;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 92 + 4}%`;
                p.style.top = `${Math.random() * 85 + 8}%`;
                p.style.animationDuration = `${Math.random() * 3 + 2.5}s`;
                p.style.animationDelay = `${Math.random() * 2}s`;
                header.appendChild(p);
            }
        }
        initAmbientParticles();

        function startSimulation() {
            document.getElementById('display-name').innerText = document.getElementById('cfg-name').value;
            document.getElementById('display-phone').innerText = document.getElementById('cfg-phone').value;
            document.getElementById('display-amount').innerText = document.getElementById('cfg-amount').value;
            
            const dateStr = document.getElementById('cfg-date').value;
            document.getElementById('display-date').innerText = dateStr;
            
            if(dateStr.includes('kl ')) {
                const timeOnly = dateStr.split('kl ')[1];
                document.getElementById('live-time').innerText = timeOnly;
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('swish-app').style.display = 'flex';
        }

        function returnToSetup() {
            document.getElementById('swish-app').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        // Tap handler strictly for the green header area
        function handleGreenHeaderTap(e) {
            playChimeSound();
            
            const header = document.getElementById('green-header');
            const rect = header.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.classList.add('burst-particle');
                
                const size = Math.random() * 6 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${clickX}px`;
                particle.style.top = `${clickY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 90 + 15;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                header.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 850);
            }
        }

        function playChimeSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (err) {}
        }
    </script>
</body>
</html>
