<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swish - Simulering</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b131e;
            overflow: hidden;
            color: #ffffff;
        }

        /* Setup Panel */
        #setup-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121c2c;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .setup-card {
            background: #1b283e;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .setup-card h2 {
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            color: #4cd964;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #a0aec0;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0b131e;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4cd964;
        }

        .launch-btn {
            width: 100%;
            padding: 14px;
            background: #4cd964;
            border: none;
            border-radius: 8px;
            color: #0b131e;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .launch-btn:hover {
            background: #3ebc52;
        }

        /* Swish App View */
        #swish-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: #0f1724;
            user-select: none;
            cursor: pointer;
        }

        /* Top Status Bar */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            z-index: 10;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .battery-icon {
            border: 1px solid #fff;
            border-radius: 3px;
            padding: 1px 3px;
            font-size: 10px;
        }

        /* Main Confirmation Screen */
        .swish-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Top Green Gradient Section */
        .green-header {
            flex: 0 0 52%;
            background: linear-gradient(135deg, #28a745 0%, #7bed9f 100%);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.3);
        }

        .check-container {
            width: 90px;
            height: 90px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            animation: pulseCheck 2s infinite ease-in-out;
        }

        .check-icon {
            width: 45px;
            height: 25px;
            border-left: 4px solid #ffffff;
            border-bottom: 4px solid #ffffff;
            transform: rotate(-45deg) translate(3px, -2px);
        }

        .success-text {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.3px;
        }

        /* Bottom Dark Details Section */
        .dark-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
            background-color: #0f1724;
            position: relative;
        }

        .timestamp {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .recipient-name {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }

        .recipient-phone {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .amount-display {
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Bottom Controls / Logo Area */
        .bottom-bar {
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            background-color: #0f1724;
        }

        .swish-logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .swish-spiral {
            width: 32px;
            height: 32px;
            background: conic-gradient(from 0deg, #ff007f, #7f00ff, #00ffff, #00ff7f, #ffff00, #ff007f);
            border-radius: 50%;
        }

        .swish-brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            font-style: italic;
        }

        .close-btn {
            width: 44px;
            height: 44px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            color: #ffffff;
            font-size: 20px;
        }

        .close-btn:active {
            background: #334155;
        }

        /* Interactive Particle Effects (Glitter tap) */
        .particle {
            position: absolute;
            background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: burst 0.8s forwards ease-out;
        }

        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(0.2);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes pulseCheck {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Setup Form to customize the preview -->
    <div id="setup-panel">
        <div class="setup-card">
            <h2>Swish Konfiguration</h2>
            <div class="input-group">
                <label>Mottagarens namn</label>
                <input type="text" id="input-name" value="Andersson Sam">
            </div>
            <div class="input-group">
                <label>Telefonnummer</label>
                <input type="text" id="input-phone" value="+46 70 887 12 16">
            </div>
            <div class="input-group">
                <label>Belopp (t.ex. 375 kr)</label>
                <input type="text" id="input-amount" value="375 kr">
            </div>
            <div class="input-group">
                <label>Datum & Tid</label>
                <input type="text" id="input-time" value="17 mars 2026, kl 13:10">
            </div>
            <button class="launch-btn" onclick="launchSwish()">Visa Skärm</button>
        </div>
    </div>

    <!-- The Replicated Swish App View -->
    <div id="swish-app" onclick="createParticles(event)">
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="display-statusbar-time">13:10</span>
            <div class="status-right">
                <span>5G</span>
                <div class="battery-icon">86</div>
            </div>
        </div>

        <!-- Main Confirmation Screen Content -->
        <div class="swish-screen">
            <div class="green-header">
                <div class="check-container">
                    <div class="check-icon"></div>
                </div>
                <div class="success-text">Din betalning är skickad!</div>
            </div>

            <div class="dark-details">
                <div class="timestamp" id="display-time">17 mars 2026, kl 13:10</div>
                <div class="recipient-name" id="display-name">Andersson Sam</div>
                <div class="recipient-phone" id="display-phone">+46 70 887 12 16</div>
                <div class="amount-display" id="display-amount">375 kr</div>
            </div>

            <div class="bottom-bar" onclick="event.stopPropagation()">
                <div class="swish-logo-area">
                    <div class="swish-spiral"></div>
                    <div class="swish-brand">swish</div>
                </div>
                <button class="close-btn" onclick="resetSetup()">×</button>
            </div>
        </div>
    </div>

    <script>
        function launchSwish() {
            // Grab values from setup inputs
            document.getElementById('display-name').innerText = document.getElementById('input-name').value;
            document.getElementById('display-phone').innerText = document.getElementById('input-phone').value;
            document.getElementById('display-amount').innerText = document.getElementById('input-amount').value;
            
            const timeVal = document.getElementById('input-time').value;
            document.getElementById('display-time').innerText = timeVal;
            
            // Extract time for status bar if possible
            if(timeVal.includes('kl ')) {
                document.getElementById('display-statusbar-time').innerText = timeVal.split('kl ')[1];
            }

            // Switch views
            document.getElementById('setup-panel').style.display = 'none';
            document.getElementById('swish-app').style.display = 'flex';
        }

        function resetSetup() {
            document.getElementById('swish-app').style.display = 'none';
            document.getElementById('setup-panel').style.display = 'flex';
        }

        // Interactive particle generator for the glitter tap effect
        function createParticles(e) {
            const app = document.getElementById('swish-app');
            const rect = app.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Generate multiple glitter particles per tap
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                // Random spray direction
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                app.appendChild(particle);

                // Clean up element after animation finishes
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }
    </script>
</body>
</html>
