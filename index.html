<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swish - Exakt Kopia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b131e;
            overflow: hidden;
            color: #ffffff;
        }

        /* Setup Screen */
        #setup-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1724;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 100;
        }

        .setup-card {
            background: #1b283e;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .setup-card h2 {
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            color: #4cd964;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #a0aec0;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0b131e;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4cd964;
        }

        .launch-btn {
            width: 100%;
            padding: 14px;
            background: #2ba696;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Swish Confirmation Screen */
        #swish-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: #0b121c;
            user-select: none;
            cursor: pointer;
        }

        /* Top iOS Status Bar */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            z-index: 10;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .battery-box {
            border: 1px solid #fff;
            border-radius: 3px;
            padding: 1px 3px;
            font-size: 10px;
        }

        /* Confirmation Main Layout */
        .confirmation-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Green Header with curved bottom edge */
        .green-header {
            flex: 0 0 52%;
            background: linear-gradient(135deg, #189856 0%, #72e8a4 100%);
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 8px 25px rgba(24, 152, 86, 0.35);
        }

        .check-circle {
            width: 82px;
            height: 82px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        .check-checkmark {
            width: 38px;
            height: 20px;
            border-left: 4px solid #ffffff;
            border-bottom: 4px solid #ffffff;
            transform: rotate(-45deg) translate(3px, -2px);
        }

        .success-message {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        /* Details Section */
        .details-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 28px;
            background-color: #0b121c;
        }

        .transaction-date {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .recipient-name {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            letter-spacing: -0.2px;
        }

        .recipient-phone {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        .amount-text {
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Bottom Brand Bar */
        .bottom-bar {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background-color: #0b121c;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Exact Swish Logo Graphic reproduction */
        .swish-logo-svg {
            width: 32px;
            height: 32px;
        }

        .swish-word {
            font-size: 24px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .close-circle {
            width: 42px;
            height: 42px;
            background: #172130;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 20px;
            border: none;
        }

        /* Glitter Particle Animation */
        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: particleAnim 0.85s forwards ease-out;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
        }

        @keyframes particleAnim {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Setup Form -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>Swish Simuleringsinställningar</h2>
            <div class="input-group">
                <label>Mottagarnamn</label>
                <input type="text" id="cfg-name" value="Andersson Sam">
            </div>
            <div class="input-group">
                <label>Telefonnummer</label>
                <input type="text" id="cfg-phone" value="+46 70 887 12 16">
            </div>
            <div class="input-group">
                <label>Belopp</label>
                <input type="text" id="cfg-amount" value="375 kr">
            </div>
            <div class="input-group">
                <label>Datum & Tid</label>
                <input type="text" id="cfg-date" value="17 mars 2026, kl 13:10">
            </div>
            <button class="launch-btn" onclick="startSimulation()">Visa Skärm</button>
        </div>
    </div>

    <!-- Replicated Swish App Screen -->
    <div id="swish-app" onclick="handleScreenTap(event)">
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="disp-status-time">13:10</span>
            <div class="status-right">
                <span>5G</span>
                <div class="battery-box">86</div>
            </div>
        </div>

        <!-- Confirmation Content -->
        <div class="confirmation-container">
            <div class="green-header">
                <div class="check-circle">
                    <div class="check-checkmark"></div>
                </div>
                <div class="success-message">Din betalning är skickad!</div>
            </div>

            <div class="details-body">
                <div class="transaction-date" id="disp-date">17 mars 2026, kl 13:10</div>
                <div class="recipient-name" id="disp-name">Andersson Sam</div>
                <div class="recipient-phone" id="disp-phone">+46 70 887 12 16</div>
                <div class="amount-text" id="disp-amount">375 kr</div>
            </div>

            <!-- Bottom Footer Bar with authentic logo -->
            <div class="bottom-bar" onclick="event.stopPropagation()">
                <div class="brand-lockup">
                    <svg class="swish-logo-svg" viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="swishGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffff" />
                                <stop offset="50%" stop-color="#0080ff" />
                                <stop offset="100%" stop-color="#8000ff" />
                            </linearGradient>
                            <linearGradient id="swishGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffff00" />
                                <stop offset="50%" stop-color="#ff8000" />
                                <stop offset="100%" stop-color="#ff0080" />
                            </linearGradient>
                        </defs>
                        <!-- Left Arc -->
                        <path d="M50 10 A40 40 0 0 0 25 85 L35 75 A25 25 0 0 1 50 25 Z" fill="url(#swishGrad1)" />
                        <!-- Right Arc -->
                        <path d="M50 90 A40 40 0 0 0 75 15 L65 25 A25 25 0 0 1 50 75 Z" fill="url(#swishGrad2)" />
                    </svg>
                    <div class="swish-word">swish</div>
                </div>
                <button class="close-circle" onclick="returnToSetup()">✕</button>
            </div>
        </div>
    </div>

    <script>
        function startSimulation() {
            document.getElementById('disp-name').innerText = document.getElementById('cfg-name').value;
            document.getElementById('disp-phone').innerText = document.getElementById('cfg-phone').value;
            document.getElementById('disp-amount').innerText = document.getElementById('cfg-amount').value;
            
            const dateStr = document.getElementById('cfg-date').value;
            document.getElementById('disp-date').innerText = dateStr;
            
            if(dateStr.includes('kl ')) {
                document.getElementById('disp-status-time').innerText = dateStr.split('kl ')[1];
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('swish-app').style.display = 'flex';
        }

        function returnToSetup() {
            document.getElementById('swish-app').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        // Trigger glitter particle burst and authentic audio chime on tap
        function handleScreenTap(e) {
            playChimeSound();
            
            const app = document.getElementById('swish-app');
            const rect = app.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 7 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${clickX}px`;
                particle.style.top = `${clickY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                app.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 850);
            }
        }

        // Synthesize authentic notification bell/chime sound using Web Audio API
        function playChimeSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime); // C6 note
                osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.15); // E6 note

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (err) {
                // Audio context suppressed or blocked by browser policy until interaction
            }
        }
    </script>
</body>
</html>
