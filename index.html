<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swish - 1:1 Kopia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b121c;
            overflow: hidden;
            color: #ffffff;
        }

        /* Setup Form Screen */
        #setup-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b121c;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 100;
        }

        .setup-card {
            background: #172130;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .setup-card h2 {
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
            color: #4cd964;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0b121c;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4cd964;
        }

        .launch-btn {
            width: 100%;
            padding: 13px;
            background: #189856;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Swish App Simulation Screen */
        #swish-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: #0b121c;
            user-select: none;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Green Header - Organiskt rundad kant och flytande partiklar */
        .green-header {
            flex: 0 0 56%;
            background: radial-gradient(circle at 50% 30%, #4ae58b 0%, #169252 70%);
            border-bottom-left-radius: 50% 28px;
            border-bottom-right-radius: 50% 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(22, 146, 82, 0.4);
            overflow: hidden;
            cursor: pointer;
        }

        .check-circle {
            width: 82px;
            height: 82px;
            border: 3.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            z-index: 2;
        }

        .check-checkmark {
            width: 38px;
            height: 20px;
            border-left: 4.5px solid #ffffff;
            border-bottom: 4.5px solid #ffffff;
            transform: rotate(-45deg) translate(3px, -2px);
        }

        .success-message {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.4px;
            z-index: 2;
        }

        /* Details Body */
        .details-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 28px;
            background-color: #0b121c;
        }

        .transaction-date {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .recipient-name {
            font-size: 27px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .recipient-phone {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .amount-text {
            font-size: 44px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Bottom Footer Bar */
        .bottom-bar {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background-color: #0b121c;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .swish-logo-img {
            height: 32px;
            width: auto;
        }

        .close-circle {
            width: 42px;
            height: 42px;
            background: #172130;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 20px;
            border: none;
        }

        /* Slumpmässigt flytande partiklar inuti gröna ytan */
        .ambient-particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
            animation: floatRandom 4s infinite ease-in-out;
        }

        @keyframes floatRandom {
            0% {
                transform: translate(0, 0) scale(0.8);
                opacity: 0.2;
            }
            50% {
                transform: translate(15px, -20px) scale(1.3);
                opacity: 0.8;
            }
            100% {
                transform: translate(-10px, 10px) scale(0.8);
                opacity: 0.2;
            }
        }

        /* Tryck-partiklar (Burst) */
        .burst-particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: burstAnim 0.7s forwards ease-out;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
            z-index: 5;
        }

        @keyframes burstAnim {
            0% {
                transform: translate(0, 0) scale(0.4);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.6);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>Swish Simuleringsinställningar</h2>
            <div class="input-group">
                <label>Mottagarnamn</label>
                <input type="text" id="cfg-name" value="Shaqeel">
            </div>
            <div class="input-group">
                <label>Telefonnummer</label>
                <input type="text" id="cfg-phone" value="+46 70 000 00 00">
            </div>
            <div class="input-group">
                <label>Belopp</label>
                <input type="text" id="cfg-amount" value="1 kr">
            </div>
            <button class="launch-btn" onclick="startSimulation()">Visa Skärm</button>
        </div>
    </div>

    <!-- Swish App Simulation Screen -->
    <div id="swish-app">
        <div class="main-container">
            <!-- Green Header (Klickbar för ljud och partiklar) -->
            <div class="green-header" id="green-header" onclick="handleGreenHeaderTap(event)">
                <div class="check-circle">
                    <div class="check-checkmark"></div>
                </div>
                <div class="success-message">Din betalning är skickad!</div>
            </div>

            <div class="details-body">
                <div class="transaction-date" id="display-date">25 aug. 2026, kl 02:12</div>
                <div class="recipient-name" id="display-name">Shaqeel</div>
                <div class="recipient-phone" id="display-phone">+46 70 000 00 00</div>
                <div class="amount-text" id="display-amount">1 kr</div>
            </div>

            <!-- Bottom Footer Bar -->
            <div class="bottom-bar">
                <div class="brand-lockup">
                    <img src="IMG_4552.png" alt="Swish Logo" class="swish-logo-img">
                </div>
                <button class="close-circle" onclick="returnToSetup()">✕</button>
            </div>
        </div>
    </div>

    <script>
        // Skapa slumpmässigt flytande partiklar
        function initAmbientParticles() {
            const header = document.getElementById('green-header');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.classList.add('ambient-particle');
                const size = Math.random() * 5 + 2;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 90 + 5}%`;
                p.style.top = `${Math.random() * 80 + 10}%`;
                p.style.animationDuration = `${Math.random() * 3 + 2.5}s`;
                p.style.animationDelay = `${Math.random() * 3}s`;
                header.appendChild(p);
            }
        }
        initAmbientParticles();

        function startSimulation() {
            document.getElementById('display-name').innerText = document.getElementById('cfg-name').value;
            document.getElementById('display-phone').innerText = document.getElementById('cfg-phone').value;
            document.getElementById('display-amount').innerText = document.getElementById('cfg-amount').value;
            
            // Frys tiden till exakt nu när betalningen startar
            const now = new Date();
            const months = ['jan.', 'feb.', 'mars', 'apr.', 'maj', 'juni', 'juli', 'aug.', 'sep.', 'okt.', 'nov.', 'dec.'];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('display-date').innerText = `${day} ${month} ${year}, kl ${hours}:${minutes}`;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('swish-app').style.display = 'flex';
        }

        function returnToSetup() {
            document.getElementById('swish-app').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        // Klickhanterare för gröna ytan – tillåter flera ljudfiler att spelas samtidigt
        function handleGreenHeaderTap(e) {
            const audio = new Audio('Ljud.mp3');
            audio.currentTime = 0;
            audio.play().catch(err => {});
            
            const header = document.getElementById('green-header');
            const rect = header.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.classList.add('burst-particle');
                
                const size = Math.random() * 6 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${clickX}px`;
                particle.style.top = `${clickY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                header.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 700);
            }
        }
    </script>
</body>
</html>
